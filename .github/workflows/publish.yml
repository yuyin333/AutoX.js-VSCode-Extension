name: Publish to VS Code Marketplace

# 触发方式：
#   1) 推 tag：git tag v2.2.2 && git push origin v2.2.2
#   2) Actions 页面手动 Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 信任发布必需：用来向 GitHub 申请 OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Publish (OIDC, no PAT)
        # --allow-missing-repository：package.json 里没有 repository 字段，
        #   不加这个开关 vsce 会交互式提问，CI 里会直接卡死。
        # --oidc：用 GitHub Actions 的 OIDC token 换一次性的市场凭证，不存长期令牌。
        run: npx --yes @vscode/vsce@4.0.0 publish --oidc --allow-missing-repository
